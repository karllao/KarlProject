
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>响应式表单</title>
  <!-- 引入 Bootstrap CSS -->
  <link rel="stylesheet" href="/statics/plugins/bootstrap-5.3.7-dist/css/bootstrap.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">响应式表单</h2>
    <form>
      <!-- 姓名 -->
      <div class="mb-3">
        <label for="name" class="form-label">姓名</label>
        <input type="text" class="form-control" id="name" placeholder="请输入您的姓名">
      </div>

      <!-- 邮箱 -->
      <div class="mb-3">
        <label for="email" class="form-label">邮箱</label>
        <input type="email" class="form-control" id="email" placeholder="请输入您的邮箱">
      </div>

      <!-- 电话号码 -->
      <div class="mb-3">
        <label for="phone" class="form-label">电话号码</label>
        <input type="tel" class="form-control" id="phone" placeholder="请输入您的电话号码">
      </div>

      <!-- 性别 -->
      <div class="mb-3">
        <label class="form-label">性别</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gender" id="male" value="male">
          <label class="form-check-label" for="male">男</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="gender" id="female" value="female">
          <label class="form-check-label" for="female">女</label>
        </div>
      </div>

      <!-- 消息 -->
      <div class="mb-3">
        <label for="message" class="form-label">留言</label>
        <textarea class="form-control" id="message" rows="3" placeholder="请输入您的留言"></textarea>
      </div>

      <!-- 提交按钮 -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">提交</button>
      </div>
    </form>
  </div>

  <!-- 引入 Bootstrap JS 和 Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
